<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteBox</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/cards.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header-left">
            <h1 class="app-title">PasteBox</h1>
            <span class="app-subtitle">반복 프롬프트 · 템플릿 보관함</span>
        </div>
        <div class="toolbar">
            <button class="toolbar-btn toolbar-btn-add" id="btn-add">+ Add</button>
            <button class="toolbar-btn" id="btn-import">Import</button>
            <button class="toolbar-btn" id="btn-export">Export</button>
            <button class="toolbar-btn" id="btn-github-connect">GitHub 연결</button>
            <button class="toolbar-btn" id="btn-github-save">동기화</button>
            <button class="toolbar-btn" id="btn-github-load">불러오기</button>
            <button class="toolbar-btn" id="btn-github-disconnect">연결 해제</button>
        </div>
        <input type="file" id="import-file" class="hidden" accept=".json">
    </header>

    <main class="main-container" id="card-container"></main>

    <div class="toast-container" id="toast-container"></div>
    <footer class="status-bar">
        <span id="status-text">Ready</span>
    </footer>

    <script src="js/githubSync.js"></script>
    <script src="js/enums.js"></script>
    <script src="js/dataService.js"></script>
    <script src="js/cardListView.js"></script>
    <script src="js/modalView.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
